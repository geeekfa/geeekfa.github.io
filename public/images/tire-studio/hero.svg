<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1b33" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>

  <!-- simple reusable tire icon -->
  <g id="tire-icon-def"></g>

  <!-- INPUT: two reference photos, stacked left -->
  <g transform="translate(90,120)">
    <rect width="260" height="190" rx="18" fill="#ffffff" stroke="#d7dce6" stroke-width="2" filter="url(#shadow)"/>
    <g transform="translate(130,95)">
      <circle r="58" fill="none" stroke="#9aa7bb" stroke-width="10"/>
      <circle r="24" fill="none" stroke="#9aa7bb" stroke-width="8"/>
      <g stroke="#9aa7bb" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="-58" x2="0" y2="-34"/>
        <line x1="0" y1="58" x2="0" y2="34"/>
        <line x1="-58" y1="0" x2="-34" y2="0"/>
        <line x1="58" y1="0" x2="34" y2="0"/>
      </g>
    </g>
    <text x="130" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#4a5a70">Front photo</text>
  </g>

  <g transform="translate(90,340)">
    <rect width="260" height="190" rx="18" fill="#ffffff" stroke="#d7dce6" stroke-width="2" filter="url(#shadow)"/>
    <g transform="translate(130,90)">
      <ellipse rx="66" ry="52" fill="none" stroke="#9aa7bb" stroke-width="10"/>
      <ellipse rx="30" ry="22" fill="none" stroke="#9aa7bb" stroke-width="8"/>
    </g>
    <text x="130" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#4a5a70">Sidewall photo</text>
  </g>

  <text x="220" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#0b1b33">YOU PROVIDE</text>

  <!-- arrow -->
  <g transform="translate(460,337)">
    <line x1="0" y1="0" x2="150" y2="0" stroke="#7c5cff" stroke-width="6" stroke-linecap="round"/>
    <path d="M140,-22 L180,0 L140,22 Z" fill="#7c5cff"/>
  </g>

  <!-- OUTPUT: 3 finished catalog images -->
  <text x="870" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#0b1b33">EVERY SIZE GETS</text>

  <g transform="translate(680,120)">
    <rect width="190" height="230" rx="18" fill="#ffffff" stroke="#1f8bff" stroke-width="3" filter="url(#shadow)"/>
    <g transform="translate(95,105)">
      <circle r="62" fill="none" stroke="#1f8bff" stroke-width="11"/>
      <circle r="26" fill="none" stroke="#1f8bff" stroke-width="9"/>
      <g stroke="#1f8bff" stroke-width="7" stroke-linecap="round">
        <line x1="0" y1="-62" x2="0" y2="-36"/>
        <line x1="0" y1="62" x2="0" y2="36"/>
        <line x1="-62" y1="0" x2="-36" y2="0"/>
        <line x1="62" y1="0" x2="36" y2="0"/>
      </g>
    </g>
    <text x="95" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1f8bff">Front</text>
  </g>

  <g transform="translate(895,120)">
    <rect width="190" height="230" rx="18" fill="#ffffff" stroke="#16b67f" stroke-width="3" filter="url(#shadow)"/>
    <g transform="translate(95,105)">
      <ellipse rx="70" ry="55" fill="none" stroke="#16b67f" stroke-width="11"/>
      <ellipse rx="32" ry="24" fill="none" stroke="#16b67f" stroke-width="9"/>
      <path d="M -50,-40 A 66,66 0 0 1 50,-40" fill="none" stroke="#16b67f" stroke-width="4" stroke-dasharray="3 5"/>
    </g>
    <text x="95" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16b67f">Sidewall</text>
  </g>

  <g transform="translate(680,375)">
    <rect width="190" height="180" rx="18" fill="#ffffff" stroke="#ff8a1f" stroke-width="3" filter="url(#shadow)"/>
    <g transform="translate(95,85)">
      <ellipse rx="64" ry="46" fill="none" stroke="#ff8a1f" stroke-width="11" transform="rotate(-20)"/>
      <ellipse rx="26" ry="18" fill="none" stroke="#ff8a1f" stroke-width="9" transform="rotate(-20)"/>
    </g>
    <text x="95" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ff8a1f">45°</text>
  </g>

  <g transform="translate(895,375)">
    <rect width="190" height="180" rx="18" fill="#f4f0ff" stroke="#7c5cff" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="95" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#7c5cff">+N</text>
    <text x="95" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7c5cff">sizes</text>
    <text x="95" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7c5cff">automatically</text>
  </g>
</svg>
